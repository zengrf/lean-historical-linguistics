name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_library.py
      - run: python scripts/check_plan.py
      - name: Check M1 source imports, review status and generated artifacts
        run: |
          python scripts/import_cldf.py --check
          python scripts/build_schema.py
          python scripts/build_fixtures.py
          python scripts/review_m1.py --require-complete
          python scripts/verify_m1_delivery.py --require-complete
          python -m unittest discover -s tests -v
          git diff --exit-code -- schema/v1/dossier.schema.json data/fixtures reports/m1-review.json reports/m1-delivery.json
      - name: Check M2 generated fixtures, independent review and delivery hashes
        run: |
          python scripts/build_m2_fixtures.py --check
          python scripts/verify_m2.py --check-report
      - name: Check M3 generated fixtures, site evidence and delivery hashes
        run: |
          python scripts/build_m3_fixtures.py --check
          python scripts/verify_m3.py --check-report
      - name: Check M4 finite reconstruction evidence and delivery hashes
        run: |
          python scripts/build_m4_fixtures.py --check
          python scripts/verify_m4.py --check-report
      - name: Check M5 frozen corpus, computation and specialist-review status
        run: |
          python scripts/build_pie_corpus.py --check
          python scripts/build_pie_experiment.py --check
          python scripts/build_pie_controls.py --check
          python scripts/review_pie.py
          python scripts/verify_m5.py --check-report
          git diff --exit-code -- reports/pie-review.json
      - name: Check generated catalogue and attribution notices
        run: |
          python scripts/build_catalogue.py
          git diff --exit-code -- bibliography/README.md bibliography/references.bib library/THIRD_PARTY_NOTICES.md

  lean:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lean: ['v4.19.0', 'v4.34.1']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install pinned elan
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain "leanprover/lean4:${{ matrix.lean }}"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: lean
        run: lake +leanprover/lean4:${{ matrix.lean }} build
      - name: Audit all theorem dependencies
        working-directory: lean
        run: |
          lake +leanprover/lean4:${{ matrix.lean }} env lean Audit.lean > "$RUNNER_TEMP/axioms.txt"
          cat "$RUNNER_TEMP/axioms.txt"
          python3 ../scripts/check_proofs.py "$RUNNER_TEMP/axioms.txt"
      - name: M1 executable acceptance and round trips
        run: |
          python scripts/verify_m1.py
          python scripts/review_m1.py --require-complete
          python scripts/verify_m1_delivery.py --require-complete
          git diff --exit-code -- reports/schema-validation.json reports/m1-review.json reports/m1-delivery.json
      - name: M2 contextual rules, certificates and independent examples
        run: |
          python scripts/verify_m2.py --audit "$RUNNER_TEMP/axioms.txt"
          python scripts/verify_m2.py --check-report
          git diff --exit-code -- reports/contextual-rules.json
      - name: M3 alignment, correspondence and finite reference comparisons
        run: |
          python scripts/verify_m3.py --audit "$RUNNER_TEMP/axioms.txt"
          python scripts/verify_m3.py --check-report
          git diff --exit-code -- reports/correspondence-sites.json
      - name: M4 bounded reconstruction, ambiguity and exact inverse sets
        run: |
          python scripts/verify_m4.py --audit "$RUNNER_TEMP/axioms.txt"
          python scripts/verify_m4.py --check-report
          git diff --exit-code -- reports/exhaustive-small-domain.json
      - name: M5 source-backed pilot, certificates and empirical gate status
        run: |
          python scripts/verify_m5.py --audit "$RUNNER_TEMP/axioms.txt"
          python scripts/verify_m5.py --check-report
          python scripts/benchmark_pie.py --output "$RUNNER_TEMP/pie-benchmark.json"
          git diff --exit-code -- reports/pie-evaluation.json reports/pie-lexical-execution.json reports/pie-diagnostic-execution.json reports/pie-latin-control-execution.json
